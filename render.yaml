# Render blueprint for the ALAASKA backend (free web service).
# In Render: New + -> Blueprint -> pick this repo/branch. Secrets are entered in the dashboard.
services:
  - type: web
    name: alaaska-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: ENABLE_RAG          # DS 442 homework search needs more memory than the free plan
        value: "false"
      - key: MODEL_ID
        value: gpt-4o-mini
      - key: SUMMARIZE_MODEL_ID
        value: gpt-4o-mini
      - key: ALGORITHM
        value: RS256
      - key: MONGODB_CLIENT      # separate test database so testers don't touch real data
        value: alaaska_test
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_API_AUDIENCE
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: FRONTEND_URL        # your Vercel URL, e.g. https://alaaska-zamil.vercel.app
        sync: false
